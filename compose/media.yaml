---
services:
  jellyfin:
    image: ghcr.io/hotio/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    group_add:
      - ${JELLYFIN_RENDER_GROUP}
    volumes:
      - ./appdata/jellyfin:/config
      - ./data/media:/data/media
    ports:
      - "127.0.0.1:8096:8096"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    networks:
      - proxy
      - media
    profiles:
      - media
      - all
    restart: unless-stopped

  radarr:
    image: ghcr.io/hotio/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./appdata/radarr:/config
      - ./data:/data
    ports:
      - "127.0.0.1:7878:7878"
    networks:
      - proxy
      - media
    profiles:
      - media
      - all
    restart: unless-stopped

  sonarr:
    image: ghcr.io/hotio/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./appdata/sonarr:/config
      - ./data:/data
    ports:
      - "127.0.0.1:8989:8989"
    networks:
      - proxy
      - media
    profiles:
      - media
      - all
    restart: unless-stopped

  prowlarr:
    image: ghcr.io/hotio/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./appdata/prowlarr:/config
    ports:
      - "127.0.0.1:9696:9696"
    networks:
      - proxy
      - media
    profiles:
      - media
      - all
    restart: unless-stopped

  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORTS=8080/tcp,8080/udp
    volumes:
      - ./appdata/qbittorrent:/config
      - ./data/torrents:/data/torrents
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - proxy
      - media
    profiles:
      - media
      - all
    restart: unless-stopped

  seerr:
    image: ghcr.io/hotio/seerr:latest
    container_name: seerr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./appdata/seerr:/config
    ports:
      - "127.0.0.1:5055:5055"
    networks:
      - proxy
      - media
    profiles:
      - media
      - all
    restart: unless-stopped

  m4sport:
    image: ghcr.io/balintsoos/m4sport@sha256:11736e8549dddc9d3547f18a25b77d496c25504f6d7c2b9268d0836b3f879dcc
    container_name: m4sport
    environment:
      - TZ=${TZ}
      - PORT=8060
    ports:
      - "127.0.0.1:8060:8060"
    networks:
      - proxy
      - media
    profiles:
      - media
      - all
    restart: unless-stopped

networks:
  proxy:
  media:
