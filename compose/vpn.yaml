---
services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    environment:
      - WG_HOST=${WG_HOST}
      - PASSWORD_HASH=${WG_ADMIN_PASSWORD_HASH}
    volumes:
      - ./appdata/wg-easy:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - proxy
    profiles:
      - vpn
      - all
    restart: unless-stopped

  cloudflare-ddns:
    image: timothyjmiller/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - CF_DDNS_API_TOKEN=${CF_DDNS_API_TOKEN}
      - CF_DDNS_ZONE_ID=${CF_DDNS_ZONE_ID}
      - CF_DDNS_SUBDOMAIN=${CF_DDNS_SUBDOMAIN}
    volumes:
      - ./appdata/cloudflare-ddns/config.json:/config.json
    profiles:
      - vpn
      - all
    restart: unless-stopped

networks:
  proxy:
